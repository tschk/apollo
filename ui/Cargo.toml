[package]
name = "apollo-ui"
version = "0.2.2"
edition = "2021"
license = "MPL-2.0"
description = "Desktop chat UI for apollo-agent (Crepuscularity + GPUI)"
repository = "https://github.com/tschk/apollo"
publish = false

[[bin]]
name = "apollo-ui"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
crepuscularity-gpui = { version = "0.5.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tungstenite = "0.24"
# Browser sign-in + the shared credential store apollo reads.
rs_ai_oauth = "0.2.31"
# Provider catalog (ids, base URLs, key variables, default and known models) —
# the same `rs_ai_providers::catalog` telekinesis builds its picker from.
rs_ai_providers = { version = "0.2.36", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
global-hotkey = "0.8"

# gpui is pulled in without its default platform backends, so on Linux the
# window system has to be opted into explicitly — without these the app
# starts headless and refuses to open a window even with DISPLAY set.
[target.'cfg(target_os = "linux")'.dependencies]
crepuscularity-gpui = { version = "0.5.8", features = ["x11", "wayland"] }

[dev-dependencies]
tempfile = "3"
temp-env = "0.3"
