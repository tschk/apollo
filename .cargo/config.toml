# macOS: bindgen needs an SDK sysroot to build gpui / crepuscularity-gpui.
#
# The CommandLineTools SDK is used rather than the one inside Xcode.app because
# bindgen splits BINDGEN_EXTRA_CLANG_ARGS on whitespace, so any SDK path
# containing a space — "/Applications/Xcode Beta.app/..." — is truncated and
# clang then fails to find dispatch/dispatch.h.
#
# force = false, so exporting BINDGEN_EXTRA_CLANG_ARGS yourself wins. On a
# machine with a different layout:
#   export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --show-sdk-path)"
# (only safe if that path has no spaces).
[target.aarch64-apple-darwin.env]
BINDGEN_EXTRA_CLANG_ARGS = "--sysroot=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"

[target.x86_64-apple-darwin.env]
BINDGEN_EXTRA_CLANG_ARGS = "--sysroot=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
