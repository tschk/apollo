[package]
name = "unthinkclaw"
version = "0.2.0"
edition = "2021"
description = "Local-first Rust AI agent runtime — Telegram-first, trait-driven, SurrealDB + RocksDB state layer."
license = "MIT"
repository = "https://github.com/undivisible/unthinkclaw"
keywords = ["agent", "ai", "llm", "telegram", "automation"]
categories = ["command-line-utilities", "web-programming::http-client"]

[[bin]]
name = "unthinkclaw"
path = "src/main.rs"

[[bin]]
name = "unthinkclaw-install"
path = "src/bin/unthinkclaw_install.rs"

[features]
default = [
    "core",
    "channel-cli",
    "channel-telegram",
    "provider-anthropic",
    "provider-ollama",
    "rs-gbrain",
    "plugin-web",
    "plugin-skills",
]

# Core (always needed)
core = []

# Optional tool packs (compile-time; also filter via toolsets/manifest)
plugin-web = []
plugin-browser = []
plugin-skills = []
plugin-advanced = []

# Channels — pick what you need
channel-cli = []
channel-telegram = []
channel-discord = []
channel-slack = []
channel-whatsapp = []
channel-signal = []
channel-matrix = []
channel-irc = []
channel-googlechat = []
channel-msteams = []

# Providers — pick what you need
provider-anthropic = []
provider-copilot = []
provider-ollama = []

# Swarm mode (distributed agent coordination)
swarm = []

# Local SQLite brain (gbrain / rs_gbrain on crates.io)
rs-gbrain = ["dep:rs_gbrain"]

# Desktop automation (rs_peekaboo on crates.io)
peekaboo = ["dep:rs_peekaboo"]

# Bundles
all-channels = ["channel-cli", "channel-telegram", "channel-discord", "channel-slack", "channel-whatsapp", "channel-signal", "channel-matrix", "channel-irc", "channel-googlechat", "channel-msteams"]
all-providers = ["provider-anthropic", "provider-copilot", "provider-ollama"]
desktop = ["plugin-browser", "peekaboo"]
all-plugins = ["plugin-web", "plugin-browser", "plugin-skills", "plugin-advanced", "peekaboo"]
full = ["all-channels", "all-providers", "all-plugins", "swarm"]

[dependencies]
rs_gbrain = { package = "gbrain", version = "0.1", optional = true }
rs_peekaboo = { version = "0.3", optional = true }

# Rotary (rx4) — agent harness engine providing the core agent loop, tools,
# providers, sessions, skills, memory, guardrails, and MCP support.
# Used as a path dependency during the migration from unthinkclaw's built-in
# agent loop to rx4's harness.
rx4 = { path = "../rotary", default-features = false, features = ["ipc", "builtin-tools", "providers", "mcp"] }

# Async runtime (optimized features only)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process", "io-std"] }
async-trait = "0.1"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client + server (no unused features)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
dotenvy = "0.15"

# Logging (lightweight)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# UUID + Time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Embedded SurrealDB + RocksDB (primary memory backend)
surrealdb = { version = "2.1", features = ["kv-rocksdb"] }
rocksdb = { version = "0.23" }

shlex = "1.3"

# Crypto (credential security)
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

# Faster synchronization primitives
parking_lot = "0.12"

# File system watcher (hot reload for tools/skills/memory)
notify = { version = "6", features = ["serde"] }

# Scheduling (Phase 4: cron)
cron = "0.12"

# Regular expressions (skill templates, etc.)
regex = "1"

# Home directory resolution
dirs = "5.0"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit
strip = true        # Strip symbols
panic = "abort"     # No unwind tables
